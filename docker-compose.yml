services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: &backend-env-file
      - path: ./backend/.env
        required: false
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://reviewer:reviewer@postgres:5432/reviewer
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes: &backend-volumes
      - ./backend/secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: *backend-env-file
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
